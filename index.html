<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MentorApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><p style="padding:40px">Cargando…</p></div>
  <div id="toast"></div>
  <div id="modal" hidden></div>

  <script>
    if (location.hostname === "127.0.0.1") {
      location.replace(location.href.replace("//127.0.0.1:", "//localhost:"));
    }
    if (location.protocol === "file:") {
      document.getElementById("app").innerHTML =
        "<div style='max-width:540px;margin:50px auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);font-family:Inter,sans-serif;color:#0f172a'><h2 style='margin-top:0'>🚀 Cómo iniciar MentorApp en Visual Studio Code</h2><p>Para que <b>Google Sign-In</b> y <b>Firebase</b> funcionen correctamente por seguridad del navegador:</p><ol style='line-height:1.7'><li>En <b>Visual Studio Code</b>, haz clic derecho en <code>index.html</code> y elige <b>Open with Live Server</b>.</li><li>O abre la terminal de VS Code y ejecuta: <code>node server.js</code> y abre <a href='http://localhost:3000' style='color:#2563eb;font-weight:bold'>http://localhost:3000</a>.</li><li>También funciona directamente al subirlo a <b>GitHub Pages</b>.</li></ol></div>";
    }
    setTimeout(function () {
      var p = document.querySelector("#app>p");
      if (p && /^Cargando…$/.test(p.textContent))
        p.innerHTML = "No se pudo iniciar. Abre la consola del navegador (F12) para ver el error, y verifica tu conexión a internet.";
    }, 8000);
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
